<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DealDesk</title>
<meta name="theme-color" content="#1A2031">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DealDesk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#12151F;--sheet:#1F2534;--raise:#2A3247;--well:#141824;--edge:#0B0D14;--ink:#E9ECF4;--muted:#9AA4BA;--line:#333C52;
  --go:#3FE0B0;--go2:#1FB58C;--goedge:#0F7A5E;--warn:#F2B84B;--stop:#FF8A8A;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 480px at 50% -120px,#2A3555 0%,transparent 70%) fixed,var(--bg);color:var(--ink);font:400 16px/1.45 var(--f);padding-bottom:env(safe-area-inset-bottom,0);min-height:100vh}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#232B40,#1A2031);padding-top:env(safe-area-inset-top,0);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 0 var(--edge),0 14px 28px rgba(0,0,0,.5)}
header .brand{font-weight:700;font-size:21px;padding:10px 16px 2px;letter-spacing:-.01em;color:var(--go);text-shadow:0 2px 0 #06231B}
nav{display:flex;overflow-x:auto;gap:2px;padding:0 8px}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 28px/1.1 var(--f);margin:6px 0 14px;letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,0,0,.5)}
h2{font:600 19px/1.2 var(--f);margin:26px 0 10px}
p{margin:0 0 10px}.sub{color:var(--muted);font-size:14px}
.sheet,.kpi{background:linear-gradient(#252C3F,var(--sheet));border:1px solid var(--line);border-radius:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 5px 0 var(--edge),0 16px 26px rgba(0,0,0,.4)}
.sheet{padding:16px;margin-bottom:18px}
label{display:block;font-weight:500;font-size:13px;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:4px;font:400 16px var(--f);color:var(--ink);background:var(--well);border:1px solid #0A0C12;border-radius:8px;padding:10px;
  box-shadow:0 3px 6px rgba(0,0,0,.55) inset,0 1px 0 rgba(255,255,255,.06)}
textarea{min-height:64px;resize:vertical}
::placeholder{color:#6B7690}
:is(input,select,textarea,button,a,summary):focus-visible{outline:3px solid var(--go);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.wide{grid-column:1/-1}
button,.btn{font:700 15px var(--f);border:0;background:linear-gradient(var(--go),var(--go2));color:#06231B;border-radius:9px;padding:10px 15px;cursor:pointer;text-decoration:none;display:inline-block;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 4px 0 var(--goedge),0 9px 14px rgba(0,0,0,.4);transition:transform .06s,box-shadow .06s}
button:active,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 0 0 var(--goedge),0 2px 4px rgba(0,0,0,.4)}
.quiet{background:linear-gradient(#333D56,var(--raise));color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 4px 0 var(--edge),0 9px 14px rgba(0,0,0,.35)}
.danger{background:linear-gradient(#472732,#391F28);color:var(--stop);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 4px 0 #1B0D12,0 9px 14px rgba(0,0,0,.35)}
.small{padding:6px 10px;font-size:13px;border-radius:7px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.note{background:#3A2E12;color:#FFDF9E;border-left:4px solid var(--warn);padding:10px 12px;font-size:14px;margin-bottom:16px;border-radius:6px;box-shadow:0 4px 0 var(--edge)}
.empty{color:var(--muted);padding:14px 2px}
details.sheet>summary{font-weight:600;cursor:pointer}
details.sheet[open]>summary{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{padding:12px 14px;transition:transform .15s}
.kpi b{display:block;font:700 26px/1.15 var(--f);color:var(--go);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.kpi span{font-size:13px;color:var(--muted)}
.funnel div{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;font-size:14px;margin:8px 0}
.funnel i{display:block;height:18px;background:linear-gradient(var(--go),var(--go2));border-radius:5px;min-width:4px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 0 var(--goedge),0 6px 10px rgba(0,0,0,.4)}
.funnel em{font-style:normal;font-weight:700;text-align:right}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:600;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 14px}
.chips button{flex:none;padding:6px 12px;font-size:13px;font-weight:600;background:var(--raise);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 3px 0 var(--edge)}
.chips button[aria-pressed="true"]{background:linear-gradient(var(--go),var(--go2));color:#06231B;transform:translateY(3px);box-shadow:0 2px 5px rgba(0,0,0,.5) inset}
.rowbtn{display:flex;width:100%;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:linear-gradient(#252C3F,var(--sheet));color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-weight:400;
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 4px 0 var(--edge),0 10px 16px rgba(0,0,0,.35)}
.rowbtn b{font-weight:600}.rowbtn small{display:block;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--raise);color:var(--ink);box-shadow:0 2px 0 var(--edge)}
.pill.s4,.pill.s5{background:var(--go);color:#06231B}.pill.s6{background:#472732;color:var(--stop)}.pill.hot{background:var(--warn);color:#2B1D00}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{flex:none;width:236px;background:var(--well);border:1px solid #0A0C12;border-radius:12px;padding:10px;box-shadow:0 4px 10px rgba(0,0,0,.6) inset,0 1px 0 rgba(255,255,255,.05)}
.col h3{margin:2px 4px 10px;font:600 14px var(--f);color:var(--muted)}
.card{background:linear-gradient(#2E3750,var(--raise));border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:11px;font-size:14px;box-shadow:0 1px 0 rgba(255,255,255,.09) inset,0 4px 0 var(--edge),0 8px 12px rgba(0,0,0,.4)}
.card select{padding:6px;font-size:13px;margin-top:8px}
.linkish{background:none;border:0;padding:0;color:var(--go);font:600 14px var(--f);text-decoration:underline;text-align:left;box-shadow:none;border-radius:2px}
.task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task .chk{flex:none;width:28px;height:28px;padding:0;background:var(--well);color:var(--go);font-size:16px;box-shadow:0 2px 5px rgba(0,0,0,.6) inset,0 1px 0 rgba(255,255,255,.08)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .t{flex:1;min-width:0}.late{color:var(--stop);font-weight:600}
.log{font-size:14px;border-left:3px solid var(--go2);padding:2px 0 2px 10px;margin:10px 0}
.log small{color:var(--muted);display:block}
.big{font:700 28px var(--f);color:var(--go);text-shadow:0 2px 0 rgba(0,0,0,.5)}
nav button{flex:none;background:none;border-bottom:4px solid transparent;border-radius:0;color:var(--muted);font:600 15px var(--f);padding:10px 10px 8px;box-shadow:none}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--go)}
nav button:active,.linkish:active,.chk:active{transform:none;box-shadow:none}

.scene{perspective:900px;height:252px;overflow:hidden;touch-action:pan-y;margin:0 -16px;padding-top:16px;cursor:grab;user-select:none;-webkit-user-select:none}
.wheel{width:190px;height:200px;margin:0 auto;position:relative;transform-style:preserve-3d;transform:translateZ(-215px);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.wheel.drag{transition:none}
.face{position:absolute;inset:0;padding:12px;border-radius:14px;background:linear-gradient(#2E3750,#1F2534);border:1px solid var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 5px 0 var(--edge);opacity:.5;transition:opacity .4s}
.face.front{opacity:1;border-color:var(--go)}
.face h3{margin:0;font:600 14px var(--f);color:var(--muted)}
.face .n{font:700 44px/1 var(--f);color:var(--go);margin:4px 0 6px;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.face .linkish{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin:3px 0;font-weight:500;color:var(--ink)}
.face .all{position:absolute;left:12px;bottom:14px}
.spin{display:flex;justify-content:center;gap:14px;align-items:center;margin:4px 0 18px}
.tilt{position:relative;transition:transform .18s;will-change:transform}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.15),transparent 60%)}
.tilt.on::after{opacity:1}
.tags{display:flex;gap:6px;flex:none;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,90px);background:var(--raise);color:var(--ink);border:1px solid var(--go);border-radius:10px;padding:10px 16px;font-weight:600;box-shadow:0 5px 0 var(--edge),0 16px 26px rgba(0,0,0,.5);transition:transform .25s;z-index:9;pointer-events:none;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
.bit{position:fixed;top:-16px;width:9px;height:14px;z-index:10;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="brand">DealDesk</div><nav id="nav" role="tablist"></nav></header>
<main><div id="warn" class="note" hidden>Preview mode: nothing is saved here. Once hosted, your data saves in the browser of the device you use.</div><div id="view"></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const KEY='dealdesk.v1';
const ST=['New','Contacted','Appointment','Offer made','Under contract','Closed','Dead'];
const TABS=[['dash','Dashboard'],['leads','Leads'],['lists','Lists'],['buyers','Buyers'],['tasks','Tasks'],['seqs','Follow-up'],['mkt','Marketing'],['money','Money'],['data','Data']];
const CATS=['Marketing','Assignment fee','Sale proceeds','Earnest money','Repairs','Closing costs','Software','Skip tracing','Other'];
let S={leads:[],buyers:[],tasks:[],camps:[],txns:[],recs:[],seqs:[]};
let ui={tab:'dash',leadId:null,view:'list',ang:0,pop:true,q:'',st:'All',range:'all',rq:'',min:'1'};
let persist=true, fresh=true;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const num=v=>parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''))||0;
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n||0)).toLocaleString();
const digits=v=>{let d=String(v||'').replace(/\D/g,'');if(d.length===11&&d[0]==='1')d=d.slice(1);return d};
const fmtP=v=>{const d=digits(v);return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:String(v||'')};
const byId=(c,id)=>S[c].find(x=>x.id===id);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const smsHref=(ph,msg)=>'sms:+1'+digits(ph)+(msg?'?&body='+encodeURIComponent(msg):'');
const leadName=l=>l.name||l.addr||fmtP(l.phone)||'Unnamed lead';

try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.leads){S=Object.assign(S,p);fresh=false}}
  localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t')}catch(e){persist=false}
$('#warn').hidden=persist;
if(fresh)S.seqs.push({id:uid(),name:'New seller lead',steps:[
  {day:0,type:'Text',msg:'Hi {name}, thanks for reaching out about {address}. When is a good time for a quick call?'},
  {day:2,type:'Call',msg:'Go over the property, their timeline, and what they need to walk away with.'},
  {day:5,type:'Text',msg:'Hi {name}, are you still open to an offer on {address}? Happy to answer any questions.'},
  {day:14,type:'Text',msg:'Hi {name}, checking back in on {address}. Has anything changed on your end?'},
  {day:30,type:'Call',msg:'Monthly check-in call.'}]});
function save(){if(!persist)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){persist=false;$('#warn').hidden=false}}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const csvLine=a=>a.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',');

function setStatus(l,st){if(l.status===st)return;l.status=st;const i=ST.indexOf(st);if(i<6)l.maxStage=Math.max(l.maxStage||0,i);
  l.log.unshift({t:new Date().toISOString(),x:'Status changed to '+st});if(st==='Closed')celebrate()}
function newLead(o){const l=Object.assign({id:uid(),created:today(),status:'New',maxStage:0,log:[],pct:'70',name:'',phone:'',email:'',addr:'',city:'',zip:'',camp:''},o);S.leads.unshift(l);return l}
const mao=l=>num(l.arv)*num(l.pct||70)/100-num(l.repairs)-num(l.fee);
const inRange=d=>ui.range==='all'||(d||'')>=addDays(today(),-parseInt(ui.range,10));
const opts=(arr,sel,blank)=>(blank!=null?`<option value="">${esc(blank)}</option>`:'')+arr.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`}).join('');
const campOpts=sel=>opts(S.camps.map(c=>[c.id,c.name]),sel,'No campaign');
const leadOpts=sel=>opts(S.leads.map(l=>[l.id,leadName(l)]),sel,'No lead');
const F=(coll,it,k,label,type,rr)=>`<label>${label}<input data-coll="${coll}" data-id="${it.id}" data-k="${k}"${rr?' data-rr':''} type="${type||'text'}"${type==='number'?' inputmode="decimal"':''} value="${esc(it[k])}"></label>`;

/* ---------- views ---------- */
const V={};
V.dash=()=>{
  const ls=S.leads.filter(l=>inRange(l.created)),tx=S.txns.filter(t=>inRange(t.date));
  const inc=sum(tx.filter(t=>t.type==='Income'),t=>num(t.amt)),exp=sum(tx.filter(t=>t.type==='Expense'),t=>num(t.amt));
  const stage=i=>ls.filter(l=>(l.maxStage||0)>=i).length;
  const due=S.tasks.filter(t=>!t.done&&t.due&&t.due<=today()).length;
  const max=Math.max(1,ls.length);
  return `<h1>Dashboard</h1>
  <label style="max-width:220px">Time range<select data-ui="range">${opts([['all','All time'],['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days'],['365','Last 12 months']],ui.range)}</select></label>
  <div class="kpis" style="margin-top:12px">
    <div class="kpi tilt"><b>${ls.length}</b><span>Leads</span></div>
    <div class="kpi tilt"><b>${stage(2)}</b><span>Appointments</span></div>
    <div class="kpi tilt"><b>${stage(3)}</b><span>Offers</span></div>
    <div class="kpi tilt"><b>${stage(4)}</b><span>Contracts</span></div>
    <div class="kpi tilt"><b>${stage(5)}</b><span>Closed deals</span></div>
    <div class="kpi tilt"><b>${money(inc)}</b><span>Income</span></div>
    <div class="kpi tilt"><b>${money(exp)}</b><span>Expenses</span></div>
    <div class="kpi tilt"><b>${money(inc-exp)}</b><span>Net profit</span></div>
  </div>
  ${due?`<div class="note">${due} task${due>1?'s':''} due or overdue. <button class="linkish" data-act="tab" data-id="tasks">Open tasks</button></div>`:''}
  <h2>Pipeline right now</h2>${wheel()}
  <h2>Pipeline funnel</h2>
  <div class="sheet funnel">${ST.slice(0,6).map((s,i)=>`<div><span>${s}</span><i style="width:${stage(i)/max*100}%"></i><em>${stage(i)}</em></div>`).join('')}
    <p class="sub" style="margin:8px 0 0">Counts every lead that reached each stage, including ones that later went dead.</p></div>
  <h2>Results by campaign</h2>${campTable(ls,tx)}`};

function campTable(ls,tx){
  if(!S.camps.length)return '<p class="empty">Add campaigns under Marketing to see cost per lead and return by source.</p>';
  const rows=S.camps.map(c=>{const cl=ls.filter(l=>l.camp===c.id),ids=cl.map(l=>l.id);
    const spend=sum(tx.filter(t=>t.type==='Expense'&&t.camp===c.id),t=>num(t.amt));
    const inc=sum(tx.filter(t=>t.type==='Income'&&(ids.includes(t.lead)||t.camp===c.id)),t=>num(t.amt));
    const con=cl.filter(l=>(l.maxStage||0)>=4).length,won=cl.filter(l=>(l.maxStage||0)>=5).length;
    return `<tr><td>${esc(c.name)}<br><span class="sub">${esc(c.channel||'')}</span></td><td>${cl.length}</td><td>${money(spend)}</td><td>${cl.length?money(spend/cl.length):'n/a'}</td><td>${con}</td><td>${won}</td><td>${money(inc)}</td><td>${spend?Math.round((inc-spend)/spend*100)+'%':'n/a'}</td></tr>`}).join('');
  return `<div class="sheet scroll"><table><tr><th>Campaign</th><th>Leads</th><th>Spend</th><th>Cost per lead</th><th>Contracts</th><th>Closed</th><th>Income</th><th>Return</th></tr>${rows}</table></div>`}

V.leads=()=>{
  const l=ui.leadId&&byId('leads',ui.leadId);
  if(l)return leadDetail(l);
  return `<h1>Leads</h1>
  <details class="sheet"${S.leads.length?'':' open'}><summary>Add a lead</summary><form data-form="lead" class="grid">
    <label>Seller name<input name="name"></label><label>Phone<input name="phone" type="tel"></label>
    <label class="wide">Property address<input name="addr"></label>
    <label>City<input name="city"></label><label>Zip<input name="zip" inputmode="numeric"></label>
    <label>Campaign<select name="camp">${campOpts('')}</select></label>
    <div class="wide"><button>Save lead</button></div></form></details>
  <div class="actions" style="margin:0 0 8px">${[['list','List'],['board','Board'],['wheel','3D wheel']].map(v=>`<button class="${ui.view===v[0]?'':'quiet'} small" data-act="board" data-id="${v[0]}">${v[1]}</button>`).join('')}</div>
  ${ui.view==='board'?board():ui.view==='wheel'?wheel():`<input type="search" data-search="q" value="${esc(ui.q)}" placeholder="Search name, address, phone" aria-label="Search leads">
  <div class="chips">${['All'].concat(ST).map(s=>`<button data-act="st" data-id="${s}" aria-pressed="${ui.st===s}">${s} ${s==='All'?S.leads.length:S.leads.filter(l=>l.status===s).length}</button>`).join('')}</div>
  <div id="llist">${leadRows()}</div>`}`};

function leadRows(){
  if(!S.leads.length)return '<p class="empty">No leads yet. Add one above, or build a list under Lists and convert the best records.</p>';
  const q=ui.q.trim().toLowerCase(),qd=q.replace(/\D/g,'');
  const a=S.leads.filter(l=>(ui.st==='All'||l.status===ui.st)&&(!q||(l.name+' '+l.addr+' '+l.city+' '+l.zip).toLowerCase().includes(q)||(qd&&digits(l.phone).includes(qd))));
  if(!a.length)return '<p class="empty">Nothing matches that search or filter.</p>';
  return a.map(l=>`<button class="rowbtn tilt" data-act="open" data-id="${l.id}"><span><b>${esc(leadName(l))}</b><small>${esc([l.addr,l.city].filter(Boolean).join(', ')||'No address')} &nbsp; ${esc(l.created)}</small></span><span class="tags">${quietDays(l)>=7&&ST.indexOf(l.status)<5?`<span class="pill hot">${quietDays(l)}d quiet</span>`:''}<span class="pill s${ST.indexOf(l.status)}">${esc(l.status)}</span></span></button>`).join('')}

function board(){return `<div class="board">${ST.map(s=>{const a=S.leads.filter(l=>l.status===s);

    <p style="margin:12px 0 4px" class="sub">Maximum offer (value x percent, minus repairs, minus fee)</p><div class="big">${num(l.arv)?money(m):'Enter a value to calculate'}</div>
    <div class="grid" style="margin-top:12px">${F('leads',l,'offer','Offer made','number',1)}${F('leads',l,'contract','Contract price','number',1)}</div></div>
  <h2>Matching buyers</h2><div class="sheet">${!S.buyers.length?'<p class="empty">Add cash buyers under Buyers to match them to deals.</p>':!price?'<p class="empty">Enter an offer, contract price, or calculator numbers to match buyers.</p>':!match.length?`<p class="empty">No buyers fit ${money(price)} in this area.</p>`:
    match.map(b=>`<div class="task"><span class="t"><b>${esc(b.name)}</b><br><span class="sub">Up to ${num(b.max)?money(num(b.max)):'any price'} &nbsp; ${esc(b.areas||'Any area')}</span></span>${digits(b.phone).length===10?`<a class="btn small" href="${smsHref(b.phone,`Hi ${String(b.name).split(' ')[0]}, I have a property in ${l.city||l.zip||'your area'} at ${money(price)}. Want the details?`)}">Text deal</a>`:''}</div>`).join('')}</div>
  <h2>Follow-up</h2><div class="sheet">${S.seqs.length?`<form data-form="startseq" class="grid"><input type="hidden" name="lead" value="${l.id}"><label>Sequence<select name="seq">${opts(S.seqs.map(s=>[s.id,s.name]))}</select></label><div style="align-self:end"><button>Start sequence</button></div></form>`:'<p class="empty">Create a sequence under Follow-up first.</p>'}
    <form data-form="task" class="grid" style="margin-top:12px"><input type="hidden" name="lead" value="${l.id}"><label>One-off task<input name="title" required placeholder="Send comps"></label><label>Due<input name="due" type="date" value="${today()}"></label><div style="align-self:end"><button class="quiet">Add task</button></div></form>

    <form data-form="txn" class="grid" style="margin-top:10px"><input type="hidden" name="lead" value="${l.id}"><input type="hidden" name="date" value="${today()}"><input type="hidden" name="camp" value="">
    <label>Type<select name="type">${opts(['Income','Expense'])}</select></label><label>Category<input name="cat" list="cats" required></label><label>Amount<input name="amt" type="number" step="0.01" inputmode="decimal" required></label><div style="align-self:end"><button class="quiet">Log it</button></div></form></div>
  <h2>Notes and activity</h2><div class="sheet"><form data-form="note"><input type="hidden" name="lead" value="${l.id}"><label>Add a note<textarea name="x" required></textarea></label><div class="actions"><button>Save note</button></div></form>

const taskSort=(a,b)=>(a.done-b.done)||String(a.due||'9').localeCompare(String(b.due||'9'));
function taskRow(t){const l=t.lead&&byId('leads',t.lead),late=!t.done&&t.due&&t.due<today();
  return `<div class="task${t.done?' done':''}"><button class="chk" data-act="done" data-id="${t.id}" aria-label="${t.done?'Reopen':'Complete'} task">${t.done?'&#10003;':''}</button>

  ${t.kind==='Text'&&l&&digits(l.phone).length===10&&!t.done?`<a class="btn small" href="${smsHref(l.phone,t.msg)}">Send text</a>`:''}${t.kind==='Call'&&l&&digits(l.phone).length===10&&!t.done?`<a class="btn small" href="tel:+1${digits(l.phone)}">Call</a>`:''}
  <button class="danger small" data-act="del" data-coll="tasks" data-id="${t.id}" aria-label="Delete task">Delete</button></div>`}

V.tasks=()=>{const open=S.tasks.filter(t=>!t.done).sort(taskSort),done=S.tasks.filter(t=>t.done);
  const g=[['Overdue',open.filter(t=>t.due&&t.due<today())],['Today',open.filter(t=>t.due===today())],['Upcoming',open.filter(t=>!t.due||t.due>today())]];

  ${S.tasks.length?'':'<p class="empty">No tasks yet. Starting a follow-up sequence on a lead fills this list for you.</p>'}
  ${g.filter(x=>x[1].length).map(x=>`<h2>${x[0]} (${x[1].length})</h2><div class="sheet">${x[1].map(taskRow).join('')}</div>`).join('')}
  ${done.length?`<details class="sheet"><summary>Completed (${done.length})</summary>${done.map(taskRow).join('')}<div class="actions"><button class="danger small" data-act="cleardone">Delete completed tasks</button></div></details>`:''}`};

V.lists=()=>{const cur=ui.recId&&byId('recs',ui.recId);return cur?recDetail(cur):`<h1>Lists</h1><p class="sub">Import each list you pull (tax delinquent, absentee, code violations). Properties that show up on more than one list rise to the top.</p>

    <label class="wide">Property address<input name="addr"></label><label>City<input name="city"></label><label>Zip<input name="zip" inputmode="numeric"></label><div class="wide"><button>Save to Probate list</button></div></form></details>
  <div class="grid"><label>Search<input type="search" data-search="rq" value="${esc(ui.rq)}" placeholder="Address or owner"></label><label>Show<select data-ui="min">${opts([['1','All records'],['2','On 2 or more lists'],['3','On 3 or more lists']],ui.min)}</select></label>
    <label>City<select data-ui="city">${opts([...new Set(S.recs.map(r=>(r.city||'').toUpperCase()).filter(Boolean))].sort(),ui.city||'','All cities')}</select></label>

function recDetail(r){const full=r.addr.indexOf('APN ')===0?'':[r.addr,r.city,r.zip].filter(Boolean).join(', '),lead=r.lead&&byId('leads',r.lead);

    <label style="margin-top:14px">Quick fill: type or paste, like "3 bd 2 ba 1,450 sqft built 1978" or just "3 2 1450 1978"<input data-quick="${r.id}" placeholder="3 2 1450 1978"></label></div>

function recDetails(r){const d=[r.beds&&r.beds+' bd',r.baths&&r.baths+' ba',r.sqft&&r.sqft+' sq ft',r.year&&'built '+r.year,r.acres&&r.acres+' ac'].filter(Boolean);return d.length?'<br>'+esc(d.join('   ')):''}
const SORTS={stack:(x,y)=>y.lists.length-x.lists.length||num(y.owed)-num(x.owed),
  owedhi:(x,y)=>num(y.owed)-num(x.owed),
  owedlo:(x,y)=>(num(x.owed)||Infinity)-(num(y.owed)||Infinity),
  city:(x,y)=>(x.city||'~').localeCompare(y.city||'~')||String(x.addr).localeCompare(String(y.addr),undefined,{numeric:true}),
  acres:(x,y)=>num(y.acres)-num(x.acres),
  sqft:(x,y)=>num(y.sqft)-num(x.sqft),
  owner:(x,y)=>(x.owner||'~').localeCompare(y.owner||'~')};
function recList(){const q=ui.rq.trim().toLowerCase(),min=parseInt(ui.min,10);
  const c=ui.city||'';
  return S.recs.filter(r=>r.lists.length>=min&&(!c||(r.city||'').toUpperCase()===c)&&(!q||(r.addr+' '+r.owner+' '+r.city).toLowerCase().includes(q))).sort(SORTS[ui.sort]||SORTS.stack)}
function recRows(){
  if(!S.recs.length)return '<p class="empty">No records yet. Import your first list above.</p>';

  <div class="actions" style="margin-top:8px">${r.lead&&byId('leads',r.lead)?`<button class="quiet small" data-act="open" data-id="${r.lead}">Open lead</button>`:`<button class="small" data-act="tolead" data-id="${r.id}">Make lead</button>`}<button class="danger small" data-act="del" data-coll="recs" data-id="${r.id}">Remove</button></div></div>`).join('')}

V.money=()=>{const inc=S.txns.filter(t=>t.type==='Income'),exp=S.txns.filter(t=>t.type==='Expense');
  const grp=a=>{const m={};a.forEach(t=>m[t.cat||'Other']=(m[t.cat||'Other']||0)+num(t.amt));return Object.entries(m).sort((x,y)=>y[1]-x[1])};
  const ti=sum(inc,t=>num(t.amt)),te=sum(exp,t=>num(t.amt));
  return `<h1>Money</h1><form data-form="txn" class="sheet grid"><label>Date<input name="date" type="date" value="${today()}"></label><label>Type<select name="type">${opts(['Expense','Income'])}</select></label><label>Category<input name="cat" list="cats" required></label><label>Amount<input name="amt" type="number" step="0.01" inputmode="decimal" required></label>
  <label>Deal<select name="lead">${leadOpts('')}</select></label><label>Campaign<select name="camp">${campOpts('')}</select></label><label class="wide">Memo<input name="memo"></label><div class="wide"><button>Add transaction</button></div></form>
  <h2>Profit and loss, all time</h2><div class="sheet"><table><tr><th>Income</th><th></th></tr>${grp(inc).map(g=>`<tr><td>${esc(g[0])}</td><td>${money(g[1])}</td></tr>`).join('')}<tr><td><b>Total income</b></td><td><b>${money(ti)}</b></td></tr>
  <tr><th>Expenses</th><th></th></tr>${grp(exp).map(g=>`<tr><td>${esc(g[0])}</td><td>${money(g[1])}</td></tr>`).join('')}<tr><td><b>Total expenses</b></td><td><b>${money(te)}</b></td></tr><tr><td><b>Net profit</b></td><td><b>${money(ti-te)}</b></td></tr></table></div>
  <h2>Transactions</h2>${S.txns.length?`<div class="sheet">${S.txns.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(t=>{const l=t.lead&&byId('leads',t.lead),c=t.camp&&byId('camps',t.camp);return `<div class="task"><span class="t">${esc(t.date)} &nbsp; <b>${esc(t.cat)}</b>${t.memo?' &nbsp; '+esc(t.memo):''}<br><span class="sub">${esc([l&&leadName(l),c&&c.name].filter(Boolean).join(' / '))}</span></span><b>${t.type==='Income'?'':'-'}${money(num(t.amt))}</b><button class="danger small" data-act="del" data-coll="txns" data-id="${t.id}">Delete</button></div>`}).join('')}</div><div class="actions"><button class="quiet small" data-act="txcsv">Download transactions CSV</button></div>`:'<p class="empty">No transactions yet.</p>'}`};

V.data=()=>`<h1>Data</h1><div class="sheet"><p>Everything is stored in this browser on this device. Download a backup regularly, and restore it on any other device to move your data.</p>
  <div class="actions"><button data-act="backup">Download backup</button><label class="btn quiet" style="color:var(--ink);font-size:15px">Restore backup<input type="file" data-file="restore" accept=".json,application/json" hidden></label><button class="quiet" data-act="leadscsv">Download leads CSV</button></div></div>
  <div class="sheet"><p class="sub">${S.leads.length} leads, ${S.recs.length} list records, ${S.buyers.length} buyers, ${S.tasks.length} tasks, ${S.txns.length} transactions.</p><button class="danger" data-act="wipe">Erase everything</button></div>`;

function render(){
  $('#nav').innerHTML=TABS.map(t=>`<button role="tab" data-act="tab" data-id="${t[0]}" aria-selected="${ui.tab===t[0]}">${t[1]}</button>`).join('');
  $('#view').innerHTML=V[ui.tab]()+`<datalist id="cats">${CATS.map(c=>`<option value="${c}">`).join('')}</datalist>`;
  applyWheel();if(ui.pop&&ui.tab==='dash')countUp();ui.pop=false;

/* ---------- CSV import ---------- */
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===','||ch==='\t'){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}
const SUF={street:'st',avenue:'ave',drive:'dr',road:'rd',court:'ct',lane:'ln',boulevard:'blvd',place:'pl',circle:'cir',way:'wy',north:'n',south:'s',east:'e',west:'w'};
const addrKey=(a,z)=>String(a).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(w=>SUF[w]||w).join(' ')+'|'+String(z||'').slice(0,5);
function importList(name,text,only){
  const rows=parseCSV(text);if(rows.length<2){alert('Include a header line and at least one row.');return false}
  const h=rows[0].map(x=>x.trim().toLowerCase()),find=(re,not)=>h.findIndex(x=>re.test(x)&&!(not&&not.test(x)));
  let ia=find(/situs|property.*address|site.*address/);if(ia<0)ia=find(/address|street/,/mail/);if(ia<0)ia=find(/address|street/);
  const iapn=find(/^apn$|parcel/),iam=find(/amount|redeem|owed/);
  if(ia<0&&iapn<0){alert('No address or parcel number column found. The header line needs a column named Address or APN.');return false}
  let ic=find(/city/,/mail/);if(ic<0)ic=find(/city/);let iz=find(/zip|postal/,/mail/);if(iz<0)iz=find(/zip|postal/);
  const io=find(/owner|name/),ip=find(/phone|mobile|cell/);let add=0,stack=0,fixed=0,filled=0;
  const dc={beds:find(/bed/),baths:find(/bath/),sqft:find(/sq\.? ?f|square|living area/,/lot|unfin|garage/),year:find(/year/),acres:find(/acre/)};
  rows.slice(1).forEach(r=>{let addr=ia>=0?(r[ia]||'').trim():'';const apn=iapn>=0?(r[iapn]||'').trim():'',owed=iam>=0?(r[iam]||'').trim():'';if(!addr&&!apn)return;
    const zip=iz>=0?(r[iz]||'').trim():'';let k=addr?addrKey(addr,zip):'apn|'+apn;if(!addr)addr='APN '+apn;
    const city=ic>=0?(r[ic]||'').trim():'',street=k.indexOf('apn|')!==0;
    let rec=S.recs.find(x=>x.key===k);
    if(rec&&apn&&rec.apn&&rec.apn!==apn){k+='#'+apn;rec=S.recs.find(x=>x.key===k)}
    if(!rec&&apn){rec=S.recs.find(x=>x.apn===apn);
      if(rec&&!only&&rec.key!==k){const bare=rec.addr.indexOf('APN ')===0||(city&&rec.addr.toUpperCase()===city.toUpperCase());
        if(street||bare){rec.key=k;rec.addr=addr;rec.zip=zip;if(city)rec.city=city;fixed++}}}
    if(rec&&!only&&city&&!rec.city)rec.city=city;
    const det={};Object.keys(dc).forEach(f=>{const v=dc[f]>=0?(r[dc[f]]||'').trim():'';if(v)det[f]=v});
    if(only){if(rec&&Object.keys(det).length){Object.assign(rec,det);filled++}return}
    if(rec){Object.assign(rec,det);if(!rec.lists.includes(name)){rec.lists.push(name);stack++}if(!rec.phone&&ip>=0)rec.phone=(r[ip]||'').trim();if(!rec.owner&&io>=0)rec.owner=(r[io]||'').trim();if(!rec.apn)rec.apn=apn;if(owed)rec.owed=owed}
    else{S.recs.push({id:uid(),key:k,addr,city:ic>=0?(r[ic]||'').trim():'',zip,owner:io>=0?(r[io]||'').trim():'',phone:ip>=0?(r[ip]||'').trim():'',apn,owed,lists:[name],...det});add++}});
  save();if(only){alert(`${filled} records updated with property details.`);return true}
  alert(`${add} new records added. ${stack} existing records stacked onto "${name}".`+(fixed?` ${fixed} records had their address updated.`:''));return true}

/* ---------- forms ---------- */
const FORMS={
  lead(o){if(!o.name&&!o.addr&&!o.phone){alert('Enter a name, phone, or address.');return false}const l=newLead(o);ui.leadId=l.id},
  note(o){const l=byId('leads',o.lead);if(l)l.log.unshift({t:new Date().toISOString(),x:o.x.trim()})},
  task(o){S.tasks.push({id:uid(),title:o.title.trim(),due:o.due||'',lead:o.lead||'',done:false,kind:'',msg:''})},
  startseq(o){const l=byId('leads',o.lead),s=byId('seqs',o.seq);if(!l||!s)return;if(!s.steps.length){alert('That sequence has no steps yet.');return false}
    const first=String(l.name||'').trim().split(' ')[0]||'there';
    s.steps.forEach(p=>S.tasks.push({id:uid(),title:p.type+': '+leadName(l),due:addDays(today(),num(p.day)),lead:l.id,done:false,kind:p.type,msg:String(p.msg).split('{name}').join(first).split('{address}').join(l.addr||'your property')}));
    l.log.unshift({t:new Date().toISOString(),x:'Started sequence: '+s.name})},
  txn(o){if(!num(o.amt)){alert('Enter an amount.');return false}S.txns.push({id:uid(),date:o.date||today(),type:o.type,cat:o.cat.trim(),amt:Math.abs(num(o.amt)),memo:(o.memo||'').trim(),lead:o.lead||'',camp:o.camp||''})},
  buyer(o){S.buyers.push(Object.assign({id:uid()},o))},
  camp(o){S.camps.push({id:uid(),name:o.name.trim(),channel:(o.channel||'').trim()})},
  seq(o){S.seqs.push({id:uid(),name:o.name.trim(),steps:[]})},
  step(o){const s=byId('seqs',o.seq);if(!s)return;s.steps.push({day:Math.max(0,Math.round(num(o.day))),type:o.type,msg:o.msg.trim()});s.steps.sort((a,b)=>a.day-b.day)},
  probate(o){const addr=o.addr.trim(),cn=o.caseno.trim(),est=o.estate.trim();if(!addr&&!cn){alert('Enter a property address or a case number.');return false}
    const k=addr?addrKey(addr,o.zip.trim()):'case|'+cn,note='Estate of '+est+(cn?', case '+cn:'');const r=S.recs.find(x=>x.key===k);
    if(r){if(!r.lists.includes('Probate'))r.lists.push('Probate');r.note=note;if(!r.owner)r.owner=o.owner.trim();if(!r.phone)r.phone=o.phone.trim()}
    else S.recs.push({id:uid(),key:k,addr:addr||'Case '+cn,city:o.city.trim(),zip:o.zip.trim(),owner:o.owner.trim()||'Estate of '+est,phone:o.phone.trim(),apn:'',owed:'',note,lists:['Probate']})},
  import(o){if(!importList(o.list.trim(),o.csv,!!o.only))return false}
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const o={};new FormData(f).forEach((v,k)=>{if(typeof v==='string')o[k]=v});
  if(FORMS[f.dataset.form](o)===false)return;save();render();if(MSG[f.dataset.form])toast(MSG[f.dataset.form])});

const ACT={
  tab(d){ui.tab=d.id;ui.leadId=null;ui.recId=null;ui.pop=true;render();window.scrollTo(0,0)},
  open(d){ui.tab='leads';ui.recId=null;ui.leadId=d.id;render();window.scrollTo(0,0)},
  back(){ui.leadId=null;render()},
  board(d){ui.view=d.id;render()},
  stage(d){ui.tab='leads';ui.leadId=null;ui.view='list';ui.st=d.id;render();window.scrollTo(0,0)},
  spin(d){paused=true;ui.ang-=(+d.id)*STEP;applyWheel()},
  st(d){ui.st=d.id;render()},
  done(d){const t=byId('tasks',d.id);if(t){t.done=!t.done;save();render()}},
  del(d){const names={leads:'this lead',tasks:'this task',recs:'this record',buyers:'this buyer',seqs:'this sequence',camps:'this campaign',txns:'this transaction'};
    if(!confirm('Delete '+names[d.coll]+'?'))return;S[d.coll]=S[d.coll].filter(x=>x.id!==d.id);
    if(d.coll==='leads'){S.tasks=S.tasks.filter(t=>t.lead!==d.id);ui.leadId=null}if(d.coll==='recs')ui.recId=null;save();render()},
  delstep(d){const s=byId('seqs',d.id);if(s){s.steps.splice(+d.i,1);save();render()}},
  cleardone(){S.tasks=S.tasks.filter(t=>!t.done);save();render()},
  tolead(d){const r=byId('recs',d.id);if(!r)return;const l=newLead({name:r.owner,phone:r.phone,addr:r.addr,city:r.city,zip:r.zip,beds:r.beds||'',baths:r.baths||'',sqft:r.sqft||'',year:r.year||'',apn:r.apn||'',owed:r.owed||'',acres:r.acres||''});
    l.log.unshift({t:new Date().toISOString(),x:'Created from lists: '+r.lists.join(', ')+(r.note?' ('+r.note+')':'')});r.lead=l.id;save();ACT.open({id:l.id})},
  pull(){fetch('county/placer-tax-default.csv',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{if(importList('Placer tax default',t))render()})
    .catch(()=>alert('No county file found. It appears after the weekly job has run on GitHub, and only on the hosted copy of this app.'))},
  rec(d){ui.recId=d.id;render();window.scrollTo(0,0)},
  recback(){ui.recId=null;render()},
  recnext(d){const a=recList(),i=a.findIndex(x=>x.id===d.id),todo=x=>!x.beds&&!x.baths&&!x.sqft&&x.addr.indexOf('APN ')!==0;
    const n=a.slice(i+1).find(todo)||a.slice(0,Math.max(i,0)).find(todo);if(!n){toast('Every home in this view has details');return}ui.recId=n.id;render();window.scrollTo(0,0)},
  clearrecs(){if(confirm('Delete all '+S.recs.length+' list records? Leads you already made stay.')){S.recs=[];save();render()}},
  recscsv(){download('list-records.csv',[csvLine(['APN','Address','City','Zip','Owner','Phone','Amount owed','Beds','Baths','Sqft','Year built','Acres','List count','Lists'])].concat(S.recs.map(r=>csvLine([r.apn,r.addr,r.city,r.zip,r.owner,r.phone,r.owed,r.beds,r.baths,r.sqft,r.year,r.acres,r.lists.length,r.lists.join('; ')]))).join('\r\n'),'text/csv')},
  buyerscsv(){download('buyers.csv',[csvLine(['Name','Phone','Email','Max price','Areas','Notes'])].concat(S.buyers.map(b=>csvLine([b.name,b.phone,b.email,b.max,b.areas,b.notes]))).join('\r\n'),'text/csv')},
  txcsv(){download('transactions.csv',[csvLine(['Date','Type','Category','Amount','Memo','Deal','Campaign'])].concat(S.txns.map(t=>{const l=byId('leads',t.lead),c=byId('camps',t.camp);return csvLine([t.date,t.type,t.cat,t.amt,t.memo,l?leadName(l):'',c?c.name:''])})).join('\r\n'),'text/csv')},
  leadscsv(){download('leads.csv',[csvLine(['Name','Phone','Email','Address','City','Zip','Status','Campaign','Asking','Value','Repairs','Offer','Contract','Created'])].concat(S.leads.map(l=>{const c=byId('camps',l.camp);return csvLine([l.name,l.phone,l.email,l.addr,l.city,l.zip,l.status,c?c.name:'',l.asking,l.arv,l.repairs,l.offer,l.contract,l.created])})).join('\r\n'),'text/csv')},
  backup(){download('dealdesk-backup-'+today()+'.json',JSON.stringify(S),'application/json')},
  wipe(){if(confirm('Erase all data on this device? This cannot be undone.')&&confirm('Last check: erase everything?')){S={leads:[],buyers:[],tasks:[],camps:[],txns:[],recs:[],seqs:[]};save();render()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b.dataset)});
document.addEventListener('input',e=>{const k=e.target.dataset.search;if(!k)return;ui[k]=e.target.value;
  if(k==='q')$('#llist').innerHTML=leadRows();else $('#rlist').innerHTML=recRows()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.file){const f=t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{if(d.file==='csv'){$('#csvbox').value=r.result;return}
      try{const p=JSON.parse(r.result);if(!p||!Array.isArray(p.leads))throw 0;if(!confirm('Replace everything on this device with this backup ('+p.leads.length+' leads)?'))return;
        S=Object.assign({leads:[],buyers:[],tasks:[],camps:[],txns:[],recs:[],seqs:[]},p);save();render()}catch(x){alert('That file is not a DealDesk backup.')}};
    r.readAsText(f);return}
  if(d.quick){const r=byId('recs',d.quick),v=t.value;if(!r||!v.trim())return;const m=re=>{const x=v.match(re);return x?x[1].replace(/,/g,''):''};
    let b=m(/(\d+(?:\.\d+)?)\s*(?:bd|bed)/i),ba=m(/(\d+(?:\.\d+)?)\s*ba/i),sq=m(/([\d,]{3,})\s*sq/i),y=m(/(?:built(?: in)?|year)\D{0,3}((?:18|19|20)\d{2})/i);
    if(!b&&!ba&&!sq){const n=(v.match(/[\d,.]+/g)||[]).map(x=>x.replace(/,/g,''));b=n[0]||'';ba=n[1]||'';sq=n[2]||'';y=y||n[3]||''}
    if(b)r.beds=b;if(ba)r.baths=ba;if(sq)r.sqft=sq;if(y)r.year=y;save();render();toast('Details saved');return}
  if(d.ui){ui[d.ui]=t.value;render();return}
  if(!d.coll)return;const it=byId(d.coll,d.id);if(!it)return;
  if(d.coll==='leads'&&d.k==='status')setStatus(it,t.value);else it[d.k]=t.value;
  if(d.coll==='recs'&&(d.k==='addr'||d.k==='zip')&&it.addr&&it.addr.indexOf('APN ')!==0)it.key=addrKey(it.addr,it.zip);
  save();if('rr' in d)render()});

/* ---------- 3D wheel, tilt, feedback ---------- */
const STEP=360/7,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const MSG={lead:'Lead saved',note:'Note saved',task:'Task added',startseq:'Sequence started',txn:'Transaction logged',buyer:'Buyer saved',camp:'Campaign added',seq:'Sequence created',step:'Step added',probate:'Probate case saved'};
let drag=null,dragged=false,paused=false,tl=null,tt;
function quietDays(l){const last=l.log&&l.log[0]?iso(l.log[0].t):l.created;return Math.max(0,Math.round((Date.parse(today())-Date.parse(last))/864e5))}
function wheel(){return `<div class="scene" role="group" aria-label="Pipeline wheel"><div class="wheel" id="wheel">${ST.map((s,i)=>{const a=S.leads.filter(l=>l.status===s);
  return `<div class="face" style="transform:rotateY(${i*STEP}deg) translateZ(215px)"><h3>${s}</h3><div class="n">${a.length}</div>${a.slice(0,3).map(l=>`<button class="linkish" data-act="open" data-id="${l.id}">${esc(leadName(l))}</button>`).join('')}${a.length?`<button class="small quiet all" data-act="stage" data-id="${s}">View all</button>`:''}</div>`}).join('')}</div></div>
  <div class="spin"><button class="quiet small" data-act="spin" data-id="-1" aria-label="Previous stage">&#9664;</button><span class="sub">Swipe or drag to spin</span><button class="quiet small" data-act="spin" data-id="1" aria-label="Next stage">&#9654;</button></div>`}
function applyWheel(dragging){const w=$('#wheel');if(!w)return;w.classList.toggle('drag',!!dragging);w.style.transform=`translateZ(-215px) rotateY(${ui.ang}deg)`;
  const f=((Math.round(-ui.ang/STEP)%7)+7)%7;w.querySelectorAll('.face').forEach((el,i)=>el.classList.toggle('front',i===f))}
function untilt(){if(tl){tl.style.transform='';tl.classList.remove('on');tl=null}}
function tilt(e){if(calm||drag)return;const el=e.target&&e.target.closest?e.target.closest('.tilt'):null;if(el!==tl)untilt();if(!el)return;tl=el;
  const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height,k=Math.min(12,1500/r.width);
  el.style.transform=`perspective(700px) rotateX(${((.5-y)*k).toFixed(2)}deg) rotateY(${((x-.5)*k).toFixed(2)}deg) translateY(-3px)`;
  el.style.setProperty('--mx',x*100+'%');el.style.setProperty('--my',y*100+'%');el.classList.add('on')}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.scene')){drag={x:e.clientX,a:ui.ang};dragged=false}else tilt(e)});
window.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x;if(Math.abs(dx)>8){dragged=true;paused=true}if(dragged){ui.ang=drag.a+dx*.45;applyWheel(true)}return}tilt(e)});
const endDrag=e=>{if(e.pointerType!=='mouse')untilt();if(!drag)return;drag=null;if(dragged){ui.ang=Math.round(ui.ang/STEP)*STEP;applyWheel();setTimeout(()=>{dragged=false},60)}};
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
document.documentElement.addEventListener('mouseleave',untilt);
document.addEventListener('click',e=>{if(dragged&&e.target.closest('.scene')){e.stopPropagation();e.preventDefault()}},true);
setInterval(()=>{if(!paused&&!calm&&!drag&&!document.hidden&&$('#wheel')){ui.ang-=STEP;applyWheel()}},3800);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1900)}
function celebrate(){setTimeout(()=>toast('Deal closed'),50);if(calm)return;const c=['#3FE0B0','#F2B84B','#E9ECF4','#1FB58C'];
  for(let i=0;i<36;i++){const b=document.createElement('i');b.className='bit';b.style.cssText=`left:${Math.random()*100}vw;background:${c[i%4]};animation-delay:${(Math.random()*.5).toFixed(2)}s;animation-duration:${(1.3+Math.random()).toFixed(2)}s`;document.body.appendChild(b);setTimeout(()=>b.remove(),3200)}}
function countUp(){if(calm)return;document.querySelectorAll('.kpi b').forEach(el=>{const txt=el.textContent,m=txt.includes('$'),to=num(txt),t0=performance.now();if(!to)return;
  const step=t=>{const p=Math.min(1,(t-t0)/650),v=to*(1-Math.pow(1-p,3));el.textContent=p===1?txt:(m?money(v):Math.round(v));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
